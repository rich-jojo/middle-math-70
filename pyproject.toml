[project]
name = "middle-math-70-central"
version = "0.2.0"
description = "Central account/problem-bank/mock-exam service for middle math 70 practice."
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.13.2",
  "argon2-cffi>=23.1.0",
  "bleach>=6.1.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "jsonschema>=4.23.0",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.32",
  "typer>=0.12.5",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
test = [
  "beautifulsoup4>=4.12.3",
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "selenium>=4.23.1"
]

[project.scripts]
mm70 = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: tests requiring a real PostgreSQL database",
  "e2e: browser tests requiring headless Chrome"
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["B008", "E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S107"]
