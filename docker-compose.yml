name: middle-math-70

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mm70}
      POSTGRES_USER: ${POSTGRES_USER:-mm70}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mm70_dev_password_change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MM70_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mm70}:${POSTGRES_PASSWORD:-mm70_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-mm70}
      MM70_SECRET_KEY: ${MM70_SECRET_KEY}
      MM70_SECURE_COOKIES: ${MM70_SECURE_COOKIES:-true}
      MM70_TRUSTED_PROXY_CIDRS: ${MM70_TRUSTED_PROXY_CIDRS:-}
      MM70_AUTO_IMPORT_BUNDLES: content/bundles/math70-v2.json,content/bundles/math70-v3-hard.json
    ports:
      - "${MM70_HOST_BIND:-127.0.0.1}:${MM70_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
