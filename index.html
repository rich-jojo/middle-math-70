<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#081323">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2355c7f5'/%3E%3Cpath d='M18 19h28v7H34v19h-7V26h-9z' fill='%2307111f'/%3E%3C/svg%3E">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>중등 수학 70점 돌파</title>
  <style>
    :root{color-scheme:dark;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:#07111f;color:#eef6ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#173457 0,transparent 38%),linear-gradient(145deg,#07111f,#0b192b)}
    main{width:min(560px,100%);padding:36px;border:1px solid #29425f;border-radius:24px;background:rgba(10,25,43,.9);box-shadow:0 22px 70px #0008}
    .eyebrow{color:#75d7ff;font-size:.82rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:.55rem 0 .6rem;font-size:clamp(2rem,8vw,3.5rem);line-height:1.04}p{color:#b8c9db;line-height:1.65}.status{display:flex;align-items:center;gap:10px;margin:24px 0;padding:14px 16px;border-radius:14px;background:#10243b;color:#d9edff}.dot{width:10px;height:10px;border-radius:50%;background:#39d98a;box-shadow:0 0 0 6px #39d98a22;animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.35}}
    .actions{display:grid;gap:10px}.button{display:block;padding:15px 18px;border-radius:13px;text-align:center;text-decoration:none;font-weight:800;background:#55c7f5;color:#03101a}.button.secondary{border:1px solid #36516e;background:transparent;color:#d7e8f7}.fine{margin:18px 0 0;font-size:.82rem;color:#7890a9}code{color:#a9e8ff}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Middle Math Platform</div>
    <h1>중등 수학<br>70점 돌파</h1>
    <p>회원가입, 문제 풀이, 모의고사, 오답 기록과 랭킹을 한곳에서 이용합니다.</p>
    <div class="status" id="status"><span class="dot"></span><span>중앙 서버 연결 중…</span></div>
    <div class="actions">
      <a class="button" id="enter" href="#" hidden>중앙 학습 서비스 열기</a>
      <a class="button secondary" href="./legacy.html">기존 CBT v2 열기</a>
    </div>
    <p class="fine">이 주소는 영구 진입점입니다. 중앙 서버 주소가 바뀌어도 자동으로 최신 주소에 연결됩니다.</p>
  </main>
  <script>
    const statusBox=document.getElementById('status');
    const enter=document.getElementById('enter');
    async function connect(){
      try{
        const response=await fetch(`./public-endpoint.json?t=${Date.now()}`,{cache:'no-store'});
        if(!response.ok)throw new Error('endpoint unavailable');
        const data=await response.json();
        const target=new URL(data.url);
        if(target.protocol!=='https:')throw new Error('invalid endpoint');
        enter.href=target.href;enter.hidden=false;
        statusBox.innerHTML='<span class="dot"></span><span>연결 완료 — 이동합니다.</span>';
        setTimeout(()=>location.replace(target.href),350);
      }catch(error){
        statusBox.innerHTML='<span>중앙 서버 주소를 불러오지 못했습니다. 잠시 뒤 다시 시도해 주세요.</span>';
        setTimeout(connect,5000);
      }
    }
    connect();
  </script>
</body>
</html>
