<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f6f2">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="description" content="중등 수학 70점 돌파 모의고사와 문제은행으로 이동합니다.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23246457'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='sans-serif' font-size='25' font-weight='900' fill='white'%3E70%3C/text%3E%3C/svg%3E">
  <title>수학 70 | 연결 중</title>
  <style>
    :root{font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:#f3f6f2;color:#17201d}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:22px;background:linear-gradient(90deg,transparent 49.9%,#dcebe566 50%,transparent 50.1%),#f3f6f2}
    main{width:min(520px,100%);padding:clamp(26px,7vw,52px);border:1px solid #d4ddd7;border-radius:16px;background:#fcfdf9;box-shadow:0 18px 50px rgba(31,68,57,.09)}
    .brand{display:flex;align-items:center;gap:12px;font-weight:850}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#246457;color:#fff;font-variant-numeric:tabular-nums}
    h1{margin:34px 0 12px;font-size:clamp(2.4rem,10vw,4.4rem);line-height:1;letter-spacing:-.06em}p{color:#66716c;line-height:1.75}.status{display:flex;align-items:center;gap:10px;margin:30px 0 0;padding-top:18px;border-top:1px solid #d4ddd7;color:#246457;font-size:.88rem;font-weight:750}.bar{width:40px;height:4px;border-radius:4px;background:linear-gradient(90deg,#246457 50%,#dcebe5 50%);background-size:200% 100%;animation:slide 1s ease infinite}@keyframes slide{50%{background-position:100% 0}}
    .button{display:block;margin-top:18px;padding:13px 16px;border-radius:10px;background:#246457;color:#fff;text-align:center;text-decoration:none;font-weight:800}
    @media(prefers-reduced-motion:reduce){.bar{animation:none}}
    @media(prefers-color-scheme:dark){:root{background:#111715;color:#edf4f0}body{background:#111715}main{background:#18211e;border-color:#31403a}p{color:#a2b0a9}.status{border-color:#31403a;color:#a9dfcf}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">70</span><span>수학 훈련실</span></div>
    <h1>시험 준비를<br>불러오는 중</h1>
    <p>문제은행과 모의고사, 자동 저장된 학습 기록으로 연결합니다.</p>
    <div class="status" id="status" role="status" aria-live="polite"><span class="bar"></span><span>중앙 학습실 확인 중</span></div>
    <a class="button" id="enter" href="#" hidden>학습실 열기</a>
  </main>
  <script>
    const statusBox=document.getElementById('status');
    const enter=document.getElementById('enter');
    async function connect(){
      try{
        const response=await fetch(`./public-endpoint.json?t=${Date.now()}`,{cache:'no-store'});
        if(!response.ok)throw new Error('endpoint unavailable');
        const data=await response.json();
        const target=new URL(data.url);
        if(target.protocol!=='https:')throw new Error('invalid endpoint');
        enter.href=target.href;enter.hidden=false;
        statusBox.innerHTML='<span class="bar"></span><span>연결 완료. 학습실을 엽니다.</span>';
        setTimeout(()=>location.replace(target.href),250);
      }catch(error){
        statusBox.innerHTML='<span>연결하지 못했습니다. 5초 뒤 다시 시도합니다.</span>';
        setTimeout(connect,5000);
      }
    }
    connect();
  </script>
</body>
</html>
